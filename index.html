<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bulk SMS Sender Pro 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2333;
            --surface3: #21262d;
            --border: rgba(255, 255, 255, .08);
            --border2: rgba(0, 212, 255, .2);
            --cyan: #00d4ff;
            --cyan-dim: #00a8cc;
            --cyan-soft: rgba(0, 212, 255, .08);
            --violet: #7c3aed;
            --violet-soft: rgba(124, 58, 237, .12);
            --green: #10b981;
            --green-soft: rgba(16, 185, 129, .1);
            --green-glow: rgba(16, 185, 129, .3);
            --white: #e6edf3;
            --muted: #7d8590;
            --red: #f85149;
            --red-soft: rgba(248, 81, 73, .12);
            --text-bright: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, .5);
            --radius: 16px;
            --transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--white);
            min-height: 100vh;
            padding: 16px;
            background: radial-gradient(ellipse at 20% 50%, rgba(124, 58, 237, .08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 212, 255, .06) 0%, transparent 50%),
                #0d1117;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--surface);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--green);
            border-radius: 10px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 20px 0 24px;
        }
        .header .logo {
            font-size: 48px;
            margin-bottom: 6px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--green), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
            -webkit-text-fill-color: var(--muted);
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            border-color: rgba(16, 185, 129, .15);
        }
        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title .step {
            background: var(--green);
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
        }

        /* ===== FIREBASE CONNECTION ===== */
        .fb-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 480px) {
            .fb-row {
                grid-template-columns: 1fr;
            }
        }

        /* ===== INPUTS ===== */
        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: var(--surface3);
            border: 2px dashed var(--border);
            border-radius: 10px;
            color: var(--white);
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
        }
        input[type="file"]:hover {
            border-color: var(--green);
        }

        input[type="text"],
        input[type="number"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 11px 14px;
            background: var(--surface3);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--white);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, .15);
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        select option {
            background: var(--surface);
            color: var(--white);
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .6px;
            display: block;
            margin-bottom: 5px;
        }

        .input-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ===== PREVIEW ===== */
        .preview-box {
            background: var(--green-soft);
            border: 1px solid rgba(16, 185, 129, .2);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            color: var(--green);
            margin-top: 8px;
            display: none;
            word-break: break-word;
            line-height: 1.6;
        }
        .preview-box.show {
            display: block;
        }

        .excel-info {
            font-size: 13px;
            color: var(--cyan);
            margin-top: 8px;
            padding: 10px 14px;
            background: var(--cyan-soft);
            border-radius: 8px;
            display: none;
            border: 1px solid var(--border2);
        }
        .excel-info.show {
            display: block;
        }

        /* ===== PROGRESS ===== */
        .progress-wrap {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
        }
        .progress-wrap.show {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .progress-status {
            color: var(--cyan);
            font-weight: 600;
        }
        .progress-count {
            color: var(--muted);
        }

        .progress-bar-bg {
            background: var(--surface3);
            border-radius: 8px;
            overflow: hidden;
            height: 8px;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(135deg, var(--cyan-dim), var(--violet));
            transition: width .4s ease;
            border-radius: 8px;
        }

        .progress-details {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }
        .progress-stats {
            color: var(--green);
        }
        .progress-failed {
            color: var(--red);
        }

        /* ===== BUTTONS ===== */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            letter-spacing: .3px;
        }
        .btn-primary {
            background: var(--green);
            color: #fff;
            box-shadow: 0 4px 20px rgba(16, 185, 129, .4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(16, 185, 129, .5);
        }
        .btn-primary:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
            box-shadow: 0 4px 20px rgba(248, 81, 73, .3);
        }
        .btn-danger:hover {
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: var(--muted);
            border: 1.5px solid var(--border);
        }
        .btn-outline:hover {
            border-color: var(--green);
            color: var(--white);
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 480px) {
            .btn-row {
                grid-template-columns: 1fr;
            }
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface3);
            border: 1px solid var(--border2);
            color: var(--text-bright);
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
            max-width: 90%;
            text-align: center;
            box-shadow: var(--shadow);
        }
        #toast.show {
            opacity: 1;
        }

        /* ===== FAILED LOG ===== */
        .failed-log {
            display: none;
            background: var(--red-soft);
            border: 1px solid rgba(248, 81, 73, .2);
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            color: var(--red);
            word-break: break-all;
        }
        .failed-log.show {
            display: block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .card {
                padding: 14px 16px;
            }
            .header h1 {
                font-size: 20px;
            }
            .header .logo {
                font-size: 36px;
            }
            .progress-header {
                font-size: 12px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo">📨</div>
            <h1>Bulk SMS Sender Pro</h1>
            <p>Excel Upload • Auto Device Switch • 100 SMS/Device</p>
        </div>

        <!-- ===== FIREBASE CONNECTION ===== -->
        <div class="card">
            <div class="card-title">
                <span class="step">1</span> Firebase Connection
            </div>
            <div class="fb-row">
                <div>
                    <label class="input-label">Database URL</label>
                    <input type="text" id="fb-url" placeholder="https://xxx-default-rtdb.firebaseio.com">
                </div>
                <div>
                    <label class="input-label">API Key</label>
                    <input type="password" id="fb-key" placeholder="AIzaSy...">
                </div>
            </div>
            <div style="margin-top:10px;">
                <label class="input-label">Node Name</label>
                <input type="text" id="fb-node" placeholder="csc6" value="csc6">
            </div>
            <button class="btn btn-primary" id="fb-connect-btn" onclick="connectFirebase()" style="margin-top:12px;">
                🔗 Connect to Firebase
            </button>
            <div id="fb-status" style="margin-top:8px;font-size:13px;color:var(--muted);text-align:center;"></div>
        </div>

        <!-- ===== STEP 1: EXCEL UPLOAD ===== -->
        <div class="card" id="excel-card">
            <div class="card-title">
                <span class="step">2</span> Upload Excel File
            </div>
            <input type="file" id="excel-file" accept=".xlsx,.xls,.csv">
            <div class="excel-info" id="excel-info">✅ <span id="excel-count">0</span> numbers loaded</div>
        </div>

        <!-- ===== STEP 2: TEMPLATE ===== -->
        <div class="card">
            <div class="card-title">
                <span class="step">3</span> SMS Template
            </div>
            <select id="template-select">
                <option value="">-- Select Template --</option>
                <option value="otp">🔐 OTP Verification</option>
                <option value="promo">📢 Promotional Offer</option>
                <option value="alert">⚠️ Security Alert</option>
                <option value="custom">✏️ Custom Message</option>
            </select>
            <textarea id="custom-template" rows="3" placeholder="Type your message here..." style="display:none;margin-top:8px;"></textarea>
            <div class="preview-box" id="template-preview"></div>
        </div>

        <!-- ===== STEP 3: SETTINGS ===== -->
        <div class="card">
            <div class="card-title">
                <span class="step">4</span> Settings
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div>
                    <label class="input-label">SMS per Device</label>
                    <input type="number" id="sms-per-device" value="100" min="1" max="500">
                    <div class="input-hint">Max 500 per device</div>
                </div>
                <div>
                    <label class="input-label">Delay (seconds)</label>
                    <input type="number" id="sms-delay" value="1.5" min="0.5" max="5" step="0.5">
                    <div class="input-hint">Between each SMS</div>
                </div>
            </div>
        </div>

        <!-- ===== START BUTTON ===== -->
        <button class="btn btn-primary" id="start-btn" onclick="startBulkSend()" disabled>
            🚀 Start Bulk Sending
        </button>

        <!-- ===== PROGRESS ===== -->
        <div class="progress-wrap" id="progress-wrap">
            <div class="progress-header">
                <span class="progress-status" id="progress-status">📤 Sending...</span>
                <span class="progress-count" id="progress-count">0 / 0</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <div class="progress-details">
                <span id="progress-device">Device: -</span>
                <span id="progress-batch">Batch: -</span>
                <span class="progress-stats" id="progress-sent">✅ Sent: 0</span>
                <span class="progress-failed" id="progress-failed">❌ Failed: 0</span>
            </div>
            <div class="failed-log" id="failed-log"></div>
            <div style="margin-top:12px;">
                <button class="btn btn-danger" id="stop-btn" onclick="stopBulkSend()" style="display:none;">
                    ⏹️ Stop Sending
                </button>
            </div>
        </div>

        <!-- ===== TOAST ===== -->
        <div id="toast"></div>

    </div>

    <script>
        // ============================================================
        // BULK SMS SENDER - COMPLETE LOGIC
        // ============================================================

        // ===== GLOBALS =====
        var DB = '';
        var APIKEY = '';
        var NODE = 'csc6';
        var IS_CONNECTED = false;

        var BULK_STATE = {
            running: false,
            numbers: [],
            msg: '',
            perDevice: 100,
            delay: 1.5,
            sent: 0,
            failed: 0,
            total: 0,
            processed: 0,
            currentDeviceIndex: 0,
            devices: [],
            failedNumbers: [],
            stopped: false
        };

        // ===== TEMPLATES =====
        var SMS_TEMPLATES = {
            otp: {
                name: 'OTP Verification',
                body: 'Your OTP is {otp}. Do not share with anyone. - CompanyName'
            },
            promo: {
                name: 'Promotional Offer',
                body: 'Hi {name}, Get 50% off on your next purchase! Use code: SAVE50. Valid till 30th June. - CompanyName'
            },
            alert: {
                name: 'Security Alert',
                body: '⚠️ Security Alert: Your account was accessed from a new device. If this wasn\'t you, contact support immediately. - CompanyName'
            }
        };

        // ============================================================
        // FIREBASE CONNECTION
        // ============================================================

        function connectFirebase() {
            var url = document.getElementById('fb-url').value.trim().replace(/\/+$/, '');
            var key = document.getElementById('fb-key').value.trim();
            var node = document.getElementById('fb-node').value.trim() || 'csc6';

            if (!url) {
                showToast('❌ Database URL daalo!');
                return;
            }

            DB = url;
            APIKEY = key;
            NODE = node;

            var btn = document.getElementById('fb-connect-btn');
            var status = document.getElementById('fb-status');
            btn.disabled = true;
            btn.textContent = '⏳ Connecting...';
            status.textContent = '🔄 Checking connection...';

            // Test connection
            var testUrl = DB + '/' + NODE + '/All_User/Info.json' + (APIKEY ? '?auth=' + encodeURIComponent(APIKEY) : '');
            fetch(testUrl)
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function(data) {
                    IS_CONNECTED = true;
                    btn.disabled = false;
                    btn.textContent = '✅ Connected';
                    btn.style.background = 'var(--green)';
                    status.textContent = '✅ Connected to Firebase! ' + (data ? Object.keys(data).length + ' devices found' :
                        'No devices found');
                    document.getElementById('start-btn').disabled = false;
                    showToast('✅ Firebase Connected!');
                })
                .catch(function(e) {
                    IS_CONNECTED = false;
                    btn.disabled = false;
                    btn.textContent = '🔗 Connect to Firebase';
                    btn.style.background = '';
                    status.textContent = '❌ Connection failed: ' + e.message;
                    showToast('❌ Connection failed: ' + e.message);
                });
        }

        // ============================================================
        // EXCEL FILE HANDLER
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            var fileInput = document.getElementById('excel-file');
            if (fileInput) {
                fileInput.addEventListener('change', function(e) {
                    handleExcelFile(e.target.files[0]);
                });
            }

            var templateSelect = document.getElementById('template-select');
            if (templateSelect) {
                templateSelect.addEventListener('change', function() {
                    handleTemplateSelect(this.value);
                });
            }
        });

        function handleExcelFile(file) {
            if (!file) return;

            var infoEl = document.getElementById('excel-info');
            var countEl = document.getElementById('excel-count');
            infoEl.classList.remove('show');

            if (!file.name.match(/\.(xlsx|xls|csv)$/i)) {
                showToast('❌ Please upload .xlsx, .xls, or .csv file');
                return;
            }

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = new Uint8Array(e.target.result);
                    var workbook = XLSX.read(data, { type: 'array' });
                    var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    var jsonData = XLSX.utils.sheet_to_json(firstSheet);

                    if (!jsonData || jsonData.length === 0) {
                        showToast('❌ No data found in Excel!');
                        return;
                    }

                    // Find phone column
                    var headers = Object.keys(jsonData[0]);
                    var phoneCol = null;
                    var possibleNames = ['number', 'phone', 'mobile', 'contact', 'phone number', 'mobile number', 'phone_no',
                        'mobileno'
                    ];

                    for (var i = 0; i < headers.length; i++) {
                        var h = headers[i].toLowerCase().trim();
                        if (possibleNames.some(function(p) { return h.indexOf(p) !== -1; })) {
                            phoneCol = headers[i];
                            break;
                        }
                    }

                    if (!phoneCol) {
                        showToast('❌ No phone column found! Use "Number" or "Phone"');
                        return;
                    }

                    // Extract numbers
                    var numbers = [];
                    for (var i = 0; i < jsonData.length; i++) {
                        var num = String(jsonData[i][phoneCol] || '').trim();
                        if (num) {
                            num = num.replace(/[^0-9+]/g, '');
                            if (num.length >= 10) {
                                numbers.push(num);
                            }
                        }
                    }

                    if (numbers.length === 0) {
                        showToast('❌ No valid numbers found!');
                        return;
                    }

                    BULK_STATE.numbers = numbers;
                    BULK_STATE.total = numbers.length;

                    countEl.textContent = numbers.length;
                    infoEl.classList.add('show');
                    showToast('✅ ' + numbers.length + ' numbers loaded!');
                    document.getElementById('start-btn').disabled = false;

                } catch (err) {
                    showToast('❌ Error reading file: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ============================================================
        // TEMPLATE HANDLER
        // ============================================================

        function handleTemplateSelect(templateId) {
            var customTextarea = document.getElementById('custom-template');
            var previewEl = document.getElementById('template-preview');

            if (templateId === 'custom') {
                customTextarea.style.display = 'block';
                previewEl.classList.remove('show');
                customTextarea.addEventListener('input', function() {
                    previewEl.textContent = customTextarea.value;
                    if (customTextarea.value.trim()) {
                        previewEl.classList.add('show');
                    } else {
                        previewEl.classList.remove('show');
                    }
                });
                return;
            }

            customTextarea.style.display = 'none';

            if (templateId && SMS_TEMPLATES[templateId]) {
                var template = SMS_TEMPLATES[templateId];
                previewEl.textContent = '📝 ' + template.body;
                previewEl.classList.add('show');
                BULK_STATE.msg = template.body;
            } else {
                previewEl.classList.remove('show');
                BULK_STATE.msg = '';
            }
        }

        // ============================================================
        // MAIN START FUNCTION
        // ============================================================

        function startBulkSend() {
            // Check connection
            if (!IS_CONNECTED) {
                showToast('❌ Pehle Firebase connect karo!');
                return;
            }

            // Get message
            var templateId = document.getElementById('template-select').value;
            var customMsg = document.getElementById('custom-template').value.trim();

            var msg = '';
            if (templateId === 'custom') {
                msg = customMsg;
            } else if (templateId && SMS_TEMPLATES[templateId]) {
                msg = SMS_TEMPLATES[templateId].body;
            }

            if (!msg) {
                showToast('⚠️ Template select karo ya custom message likho!');
                return;
            }

            // Get numbers
            var numbers = BULK_STATE.numbers;
            if (!numbers || numbers.length === 0) {
                showToast('⚠️ Pehle Excel file upload karo!');
                return;
            }

            // Get settings
            var perDevice = parseInt(document.getElementById('sms-per-device').value) || 100;
            if (perDevice > 500) perDevice = 500;
            if (perDevice < 1) perDevice = 1;

            var delay = parseFloat(document.getElementById('sms-delay').value) || 1.5;
            if (delay < 0.5) delay = 0.5;
            if (delay > 5) delay = 5;

            // Get online devices from Firebase
            var auth = APIKEY ? '?auth=' + encodeURIComponent(APIKEY) : '';
            var url = DB + '/' + NODE + '/All_User/Info.json' + auth;

            showToast('🔄 Fetching online devices...');

            fetch(url)
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function(infoData) {
                    if (!infoData || typeof infoData !== 'object') {
                        throw new Error('No devices found');
                    }

                    var devices = [];
                    var keys = Object.keys(infoData);
                    for (var i = 0; i < keys.length; i++) {
                        var d = infoData[keys[i]];
                        if (d && typeof d === 'object') {
                            var status = String(d.status || d.Status || '').toLowerCase();
                            if (status === 'online' || status === 'yes' || status === 'true') {
                                devices.push({
                                    key: keys[i],
                                    did: d.did || d.Did || keys[i],
                                    name: d.Name || d.name || keys[i]
                                });
                            }
                        }
                    }

                    if (devices.length === 0) {
                        throw new Error('No online devices found!');
                    }

                    showToast('✅ ' + devices.length + ' online devices found!');
                    startSending(numbers, msg, devices, perDevice, delay);

                })
                .catch(function(e) {
                    showToast('❌ Error fetching devices: ' + e.message);
                });
        }

        // ============================================================
        // CORE SENDING LOGIC
        // ============================================================

        function startSending(numbers, msg, devices, perDevice, delay) {
            // Initialize state
            BULK_STATE.running = true;
            BULK_STATE.stopped = false;
            BULK_STATE.msg = msg;
            BULK_STATE.perDevice = perDevice;
            BULK_STATE.delay = delay;
            BULK_STATE.sent = 0;
            BULK_STATE.failed = 0;
            BULK_STATE.processed = 0;
            BULK_STATE.total = numbers.length;
            BULK_STATE.currentDeviceIndex = 0;
            BULK_STATE.devices = devices;
            BULK_STATE.failedNumbers = [];

            // Show progress
            var progressWrap = document.getElementById('progress-wrap');
            progressWrap.classList.add('show');
            document.getElementById('stop-btn').style.display = 'block';
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').textContent = '⏳ Sending...';

            // Start sending
            sendBatch(0);
        }

        function sendBatch(startIndex) {
            if (!BULK_STATE.running || BULK_STATE.stopped) {
                finishBulkSend('⏹️ Stopped by user');
                return;
            }

            var numbers = BULK_STATE.numbers;
            var perDevice = BULK_STATE.perDevice;
            var total = BULK_STATE.total;

            if (startIndex >= total) {
                finishBulkSend('✅ Complete! All ' + total + ' SMS sent!');
                return;
            }

            var deviceIndex = BULK_STATE.currentDeviceIndex;
            var devices = BULK_STATE.devices;

            if (deviceIndex >= devices.length) {
                finishBulkSend('⚠️ No more devices! ' + (total - startIndex) + ' numbers pending');
                return;
            }

            var device = devices[deviceIndex];
            var did = device.did || device.key;
            var batchSize = Math.min(perDevice, total - startIndex);
            var endIndex = startIndex + batchSize;
            var batchNumbers = numbers.slice(startIndex, endIndex);

            // Update progress
            document.getElementById('progress-status').textContent = '📤 Sending from ' + device.name;
            document.getElementById('progress-device').textContent = 'Device: ' + device.name;
            document.getElementById('progress-batch').textContent = 'Batch: ' + (startIndex + 1) + '-' + endIndex + ' (of ' +
                total + ')';

            // Send batch
            sendBatchWithProgress(batchNumbers, BULK_STATE.msg, did, function(result) {
                BULK_STATE.sent += result.sent;
                BULK_STATE.failed += result.failed;
                BULK_STATE.processed += result.sent + result.failed;

                if (result.failedNumbers && result.failedNumbers.length > 0) {
                    BULK_STATE.failedNumbers = BULK_STATE.failedNumbers.concat(result.failedNumbers);
                }

                // Update progress UI
                var progress = (BULK_STATE.processed / total) * 100;
                document.getElementById('progress-count').textContent = BULK_STATE.processed + ' / ' + total;
                document.getElementById('progress-bar').style.width = Math.min(progress, 100) + '%';
                document.getElementById('progress-sent').textContent = '✅ Sent: ' + BULK_STATE.sent;
                document.getElementById('progress-failed').textContent = '❌ Failed: ' + BULK_STATE.failed;

                // Show failed numbers
                var failedLog = document.getElementById('failed-log');
                if (BULK_STATE.failedNumbers.length > 0) {
                    failedLog.textContent = '❌ Failed numbers: ' + BULK_STATE.failedNumbers.join(', ');
                    failedLog.classList.add('show');
                }

                // Move to next device
                BULK_STATE.currentDeviceIndex++;

                // Continue with next batch
                setTimeout(function() {
                    sendBatch(endIndex);
                }, 2000);
            });
        }

        function sendBatchWithProgress(numbers, msg, did, callback) {
            var result = { sent: 0, failed: 0, failedNumbers: [] };
            var auth = APIKEY ? '?auth=' + encodeURIComponent(APIKEY) : '';
            var url = DB + '/Verify_Device/' + did + '.json' + auth;

            var total = numbers.length;
            var completed = 0;

            if (total === 0) {
                callback(result);
                return;
            }

            numbers.forEach(function(number, index) {
                var delayMs = (BULK_STATE.delay || 1.5) * 1000;
                setTimeout(function() {
                    sendSingleSmsWithRetry(number.trim(), msg, did, url, function(success) {
                        if (success) {
                            result.sent++;
                        } else {
                            result.failed++;
                            result.failedNumbers.push(number.trim());
                        }
                        completed++;
                        if (completed === total) {
                            callback(result);
                        }
                    });
                }, index * delayMs);
            });
        }

        function sendSingleSmsWithRetry(number, msg, did, url, callback) {
            var retryAttempts = 0;
            var maxRetries = 3;

            function attemptSend() {
                fetch(url, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Number: number, Body: msg, Status: 'Yes' })
                })
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function() {
                    callback(true);
                })
                .catch(function(e) {
                    retryAttempts++;
                    if (retryAttempts < maxRetries) {
                        setTimeout(attemptSend, 3000);
                    } else {
                        console.error('Failed to send SMS to', number, e.message);
                        callback(false);
                    }
                });
            }

            attemptSend();
        }

        // ============================================================
        // STOP & FINISH
        // ============================================================

        function stopBulkSend() {
            BULK_STATE.stopped = true;
            showToast('⏹️ Stopping...');
            document.getElementById('stop-btn').style.display = 'none';
        }

        function finishBulkSend(message) {
            BULK_STATE.running = false;
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').textContent = '🚀 Start Bulk Sending';
            document.getElementById('stop-btn').style.display = 'none';
            document.getElementById('progress-status').textContent = message;

            var stats = '✅ Sent: ' + BULK_STATE.sent +
                ' | ❌ Failed: ' + BULK_STATE.failed +
                ' | 📊 Total: ' + BULK_STATE.total;

            document.getElementById('progress-sent').textContent = '✅ Sent: ' + BULK_STATE.sent;
            document.getElementById('progress-failed').textContent = '❌ Failed: ' + BULK_STATE.failed;

            showToast('📊 ' + stats);

            // Log to Firebase
            if (BULK_STATE.failedNumbers.length > 0) {
                var auth = APIKEY ? '?auth=' + encodeURIComponent(APIKEY) : '';
                var logUrl = DB + '/' + NODE + '/bulk_logs/' + Date.now() + '.json' + auth;
                fetch(logUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        timestamp: new Date().toISOString(),
                        total: BULK_STATE.total,
                        sent: BULK_STATE.sent,
                        failed: BULK_STATE.failed,
                        failedNumbers: BULK_STATE.failedNumbers,
                        message: BULK_STATE.msg,
                        perDevice: BULK_STATE.perDevice,
                        devicesUsed: BULK_STATE.devices.slice(0, BULK_STATE.currentDeviceIndex).map(function(d) {
                            return d.name;
                        })
                    })
                }).catch(function(e) { console.error('Log save failed:', e); });
            }
        }

        // ============================================================
        // TOAST
        // ============================================================

        var TOAST_TIMER = null;

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(TOAST_TIMER);
            TOAST_TIMER = setTimeout(function() {
                t.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // AUTO-CONNECT FROM URL PARAMS (Optional)
        // ============================================================

        (function() {
            var params = new URLSearchParams(window.location.search);
            var furl = params.get('furl');
            var key = params.get('key');
            var node = params.get('node');
            if (furl) {
                document.getElementById('fb-url').value = furl;
                if (key) document.getElementById('fb-key').value = key;
                if (node) document.getElementById('fb-node').value = node;
                setTimeout(connectFirebase, 500);
            }
        })();

        console.log('📨 Bulk SMS Sender Pro 2026 loaded!');
        console.log('🔥 Firebase path: /' + NODE + '/All_User/Info');
        console.log('📤 SMS via: /' + NODE + '/Verify_Device/{did}');
    </script>
